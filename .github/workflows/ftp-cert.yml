name: FTP certifikát (diagnostika)
on: workflow_dispatch
jobs:
  cert:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Ověření hostitele s platným certifikátem
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for h in dw233.nameserver.sk ftp.nameserver.sk; do
            echo "== $h -> $(getent ahostsv4 $h | awk 'NR==1{print $1}')"
            curl -sS --ssl-reqd --max-time 25 --user "${FTP_USERNAME}:${FTP_PASSWORD}" --list-only "ftp://$h/" | head -5 && echo "TLS+login OK: $h" || true
          done
